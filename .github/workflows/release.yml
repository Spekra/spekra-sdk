name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use PAT for checkout so git push triggers CI workflows
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run all checks before publishing (safety net)
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Lint
        run: pnpm lint

      - name: Start Prism mock server
        working-directory: packages/playwright
        run: |
          npx @stoplight/prism-cli mock openapi.json --port 4010 --host 127.0.0.1 &
          # Wait for Prism to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4010/api/v1/reports > /dev/null 2>&1; then
              echo "Prism is ready"
              break
            fi
            sleep 0.5
          done

      - name: Test
        run: pnpm test

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          # Use PAT instead of GITHUB_TOKEN to trigger CI workflows on the release PR
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          HUSKY: 0
